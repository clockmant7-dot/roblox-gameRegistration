<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon-admin.png">
    <link rel="apple-touch-icon" href="favicon-admin.png">
    <meta name="theme-color" content="#1e293b">
    <title>Админ панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        
        .container { 
            background: white; 
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 550px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo { 
            text-align: center; 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 30px;
        }
        
        .logo h2 { 
            color: white; 
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .logo p { 
            color: rgba(255, 255, 255, 0.9); 
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .form-group { 
            margin-bottom: 18px; 
        }
        
        label { 
            display: block; 
            font-weight: 600; 
            font-size: 13px; 
            color: #2d3748; 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none;
            background: #f9fafb;
            transition: all 0.3s ease;
        }
        
        input:focus { 
            border-color: #f59e0b;
            background: white;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-admin { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
        }
        
        .btn-admin:hover { 
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.3);
        }
        
        .btn-danger { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; 
            margin-top: 12px;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }
        
        .btn-secondary { 
            background: #e2e8f0;
            color: #2d3748;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        
        .invite-card { 
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #fbbf24;
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .invite-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(251, 191, 36, 0.2);
        }
        
        .invite-card h3 { 
            color: #92400e; 
            font-size: 15px; 
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .invite-card p { 
            color: #78350f; 
            font-size: 13px; 
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .code-badge { 
            display: inline-block; 
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #fbbf24; 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-family: 'Courier New', monospace; 
            font-size: 24px; 
            font-weight: 900;
            letter-spacing: 4px;
            margin: 8px 0;
        }
        
        .status-badge { 
            display: inline-block; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700;
            margin-left: 8px;
        }
        
        .status-waiting { 
            background: #fef3c7; 
            color: #d97706; 
        }
        
        .status-used { 
            background: #d1fae5; 
            color: #065f46;
        }
        
        .alert { 
            padding: 14px 16px; 
            border-radius: 10px; 
            font-size: 13px; 
            margin-top: 12px; 
            display: none;
            border-left: 4px solid;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-success { 
            background: #f0fdf4; 
            color: #16a34a;
            border-left-color: #22c55e;
        }
        
        .alert-error { 
            background: #fef2f2; 
            color: #c41e3a;
            border-left-color: #f5576c;
        }
        
        .count-box { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; 
            padding: 24px; 
            border-radius: 14px; 
            text-align: center; 
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
        }
        
        .count-box h2 { 
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .count-box p { 
            color: rgba(255, 255, 255, 0.9); 
            font-size: 13px;
            font-weight: 500;
        }
        
        .admin-login { 
            display: block; 
        }
        
        .admin-panel { 
            display: none; 
        }
        
        .spinner { 
            display: inline-block; 
            width: 15px; 
            height: 15px; 
            border: 2.5px solid white; 
            border-top-color: transparent; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            margin-right: 8px; 
            vertical-align: middle; 
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        
        .copy-btn { 
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            color: white; 
            border: none; 
            border-radius: 8px; 
            padding: 6px 14px; 
            font-size: 11px; 
            cursor: pointer; 
            margin-left: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .copy-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        
        .search { 
            width: 100%; 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            margin-bottom: 18px; 
            font-size: 14px; 
            outline: none;
            background: #f9fafb;
            transition: all 0.3s ease;
        }
        
        .search:focus { 
            border-color: #f59e0b;
            background: white;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }
        
        .tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 28px; 
            background: #f5f7fa; 
            padding: 6px; 
            border-radius: 12px; 
        }
        
        .tab { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            background: transparent; 
            color: #8b92a4;
            transition: all 0.3s ease;
        }
        
        .tab.active { 
            background: white; 
            color: #f59e0b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
        }
        
        .tab:hover:not(.active) {
            color: #f59e0b;
        }
        
        .section { 
            display: none; 
        }
        
        .section.active { 
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .add-result {
            background: linear-gradient(135deg, #f0fdf4 0%, #d1fae5 100%);
            border: 2px solid #22c55e;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-top: 15px;
        }

        .add-result p {
            color: #047857;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ВХОД В АДМИНКУ -->
    <div class="admin-login" id="adminLogin">
        <div class="logo">
            <h2>🔐 АДМИН ПАНЕЛЬ</h2>
            <p>ТОЛЬКО ДЛЯ АДМИНИСТРАТОРА</p>
        </div>
        <div class="form-group">
            <label>СЕКРЕТНЫЙ ПАРОЛЬ АДМИНА</label>
            <input type="password" id="adminPass" placeholder="Введите пароль">
        </div>
        <div id="loginAlert" class="alert alert-error"></div>
        <button class="btn btn-admin" onclick="adminLogin()">ВОЙТИ</button>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="admin-panel" id="adminPanel">
        <div class="logo">
            <h2>⚙️ УПРАВЛЕНИЕ</h2>
            <p>ROBLOX ACTIVATION SYSTEM</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('add', this)">➕ Добавить</button>
            <button class="tab" onclick="switchTab('list', this)">📋 Список</button>
        </div>

        <!-- ДОБАВИТЬ ИГРОКА -->
        <div class="section active" id="add">
            <div class="form-group">
                <label>EMAIL ИГРОКА</label>
                <input type="email" id="newEmail" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>НИКНЕЙМ ИГРОКА (необязательно)</label>
                <input type="text" id="newNick" placeholder="Для заметки">
            </div>
            <div id="addAlert" class="alert alert-error"></div>
            <button class="btn btn-admin" id="addBtn" onclick="addInvite()">
                СГЕНЕРИРОВАТЬ КОД И ДОБАВИТЬ
            </button>

            <!-- Результат -->
            <div id="addResult" class="add-result" style="display:none;">
                <p>📧 Отправьте этот код игроку в ЛС:</p>
                <div class="code-badge" id="generatedCode"></div>
                <button class="copy-btn" style="display:block; margin:10px auto; padding:10px 20px; font-size:13px;" onclick="copyInviteCode()">
                    📋 Скопировать код
                </button>
                <p style="font-size:12px; color:#047857; margin-top:12px;" id="addedEmail"></p>
            </div>
        </div>

        <!-- СПИСОК ИГРОКОВ -->
        <div class="section" id="list">
            <div class="count-box">
                <h2 id="totalCount">—</h2>
                <p>Всего приглашений выдано</p>
            </div>
            <input type="text" class="search" id="searchInvite" placeholder="🔍 Поиск по email или нику..." oninput="filterInvites()">
            <div id="inviteList"></div>
        </div>

    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCp4fjKxY3PO-wyW-hPcb2Smzy36j0W6X8",
    authDomain: "roblox-registration.firebaseapp.com",
    projectId: "roblox-registration",
    storageBucket: "roblox-registration.firebasestorage.app",
    messagingSenderId: "1073755164080",
    appId: "1:1073755164080:web:ebd817f94dbd1166491a75",
    measurementId: "G-LFW87CNQ09"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window._db = db;

function generateInviteCode() {
    return String(Math.floor(1000 + Math.random() * 9000));
}
window.generateInviteCode = generateInviteCode;

window.allInvites = [];

// ДОБАВИТЬ ПРИГЛАШЕНИЕ
window.addInvite = async function() {
    const btn = document.getElementById('addBtn');
    const alertBox = document.getElementById('addAlert');
    const email = document.getElementById('newEmail').value.trim().toLowerCase();
    const nick = document.getElementById('newNick').value.trim();

    alertBox.style.display = 'none';
    document.getElementById('addResult').style.display = 'none';

    if (!email) {
        alertBox.textContent = '❌ Введите email игрока!';
        alertBox.style.display = 'block';
        return;
    }

    btn.innerHTML = '<span class="spinner"></span>ГЕНЕРАЦИЯ...';
    btn.classList.add('loading');

    try {
        const existing = await getDocs(query(
            collection(db, 'invites'),
            where('email', '==', email)
        ));

        if (!existing.empty) {
            throw new Error('❌ Этот email уже есть в списке!');
        }

        let code;
        let isUnique = false;
        while (!isUnique) {
            code = generateInviteCode();
            const codeCheck = await getDocs(query(
                collection(db, 'invites'),
                where('code', '==', code)
            ));
            isUnique = codeCheck.empty;
        }

        await addDoc(collection(db, 'invites'), {
            email: email,
            nick: nick || '—',
            code: code,
            used: false,
            createdAt: new Date().toLocaleDateString('ru-RU'),
            createdTime: new Date().toLocaleTimeString('ru-RU')
        });

        document.getElementById('generatedCode').textContent = code;
        document.getElementById('addedEmail').textContent = '📧 Для: ' + email + (nick ? ' (' + nick + ')' : '');
        document.getElementById('addResult').style.display = 'block';
        document.getElementById('newEmail').value = '';
        document.getElementById('newNick').value = '';
        window._lastCode = code;

    } catch (error) {
        alertBox.textContent = error.message || '❌ Ошибка!';
        alertBox.style.display = 'block';
    }

    btn.innerHTML = 'СГЕНЕРИРОВАТЬ КОД И ДОБАВИТЬ';
    btn.classList.remove('loading');
};

// КОПИРОВАТЬ КОД
window.copyInviteCode = function() {
    navigator.clipboard.writeText(window._lastCode || '').then(() => {
        const btn = document.querySelector('.copy-btn');
        const oldText = btn.textContent;
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = oldText, 1500);
    });
};

// ЗАГРУЗИТЬ СПИСОК
window.loadInvites = async function() {
    const list = document.getElementById('inviteList');
    const count = document.getElementById('totalCount');
    list.innerHTML = '<p style="text-align:center; color:#a0aec0; padding:20px;">Загрузка...</p>';

    try {
        const snap = await getDocs(collection(db, 'invites'));
        window.allInvites = [];
        snap.forEach(d => window.allInvites.push({id: d.id, ...d.data()}));
        count.textContent = snap.size;
        renderInvites(window.allInvites);
    } catch (error) {
        list.innerHTML = '<p style="text-align:center; color:#f5576c;">❌ Ошибка загрузки</p>';
    }
};

// ОТОБРАЗИТЬ СПИСОК
window.renderInvites = function(invites) {
    const list = document.getElementById('inviteList');
    if (invites.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#a0aec0; padding:20px;">Список пуст</p>';
        return;
    }
    list.innerHTML = invites.map(inv => `
        <div class="invite-card">
            <h3>
                📧 ${inv.email}
                <span class="status-badge ${inv.used ? 'status-used' : 'status-waiting'}">
                    ${inv.used ? '✅ Использован' : '⏳ Ожидает'}
                </span>
            </h3>
            ${inv.nick !== '—' ? `<p>🎮 Ник: ${inv.nick}</p>` : ''}
            <p>
                🔢 Код: 
                <span class="code-badge" style="font-size:18px; padding:5px 10px;">${inv.code}</span>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${inv.code}')">Копировать</button>
            </p>
            <p>📅 Добавлен: ${inv.createdAt} в ${inv.createdTime}</p>
        </div>
    `).join('');
};

// ПОИСК
window.filterInvites = function() {
    const q = document.getElementById('searchInvite').value.toLowerCase();
    const filtered = window.allInvites.filter(i =>
        i.email.toLowerCase().includes(q) ||
        (i.nick && i.nick.toLowerCase().includes(q))
    );
    renderInvites(filtered);
};

</script>

<script>
    const ADMIN_PASSWORD = "HgP_GOP!0102BCK19PKB";

    window.adminLogin = function() {
        const pass = document.getElementById('adminPass').value;
        const alertBox = document.getElementById('loginAlert');

        if (pass === ADMIN_PASSWORD) {
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        } else {
            alertBox.textContent = '❌ Неверный пароль!';
            alertBox.style.display = 'block';
        }
    };

    document.getElementById('adminPass').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') window.adminLogin();
    });

    function switchTab(tab, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        el.classList.add('active');
        if (tab === 'list') window.loadInvites();
    }
    window.switchTab = switchTab;
</script>

</body>
</html>
