<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="theme-color" content="#0f172a">
    <title>GameVerse - Система Активации</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        
        .container { 
            background: white; 
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo { 
            text-align: center; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 30px;
        }
        
        .logo h2 { 
            color: white; 
            font-size: 24px; 
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .logo p { 
            color: rgba(255, 255, 255, 0.9); 
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 28px; 
            background: #f5f7fa; 
            padding: 6px; 
            border-radius: 12px;
        }
        
        .tab { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            background: transparent; 
            color: #8b92a4; 
            transition: all 0.3s ease;
        }
        
        .tab.active { 
            background: white; 
            color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        
        .tab:hover:not(.active) {
            color: #667eea;
        }
        
        .form-group { 
            margin-bottom: 18px; 
        }
        
        label { 
            display: block; 
            font-weight: 600; 
            font-size: 13px; 
            color: #2d3748; 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-row { 
            display: flex; 
            gap: 8px; 
        }
        
        input, select { 
            width: 100%; 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none; 
            transition: all 0.3s ease;
            background: #f9fafb;
        }
        
        input:focus, select:focus { 
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .rand-btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            border-radius: 10px; 
            width: 46px; 
            cursor: pointer; 
            font-size: 18px; 
            flex-shrink: 0; 
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .rand-btn:hover { 
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
        }
        
        .btn-danger { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; 
            margin-top: 12px;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }
        
        .btn-secondary { 
            background: #e2e8f0;
            color: #2d3748;
            margin-top: 8px;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        
        .btn-warning { 
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white; 
            margin-top: 8px;
        }
        
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(250, 112, 154, 0.3);
        }
        
        .alert { 
            padding: 14px 16px; 
            border-radius: 10px; 
            font-size: 13px; 
            margin-top: 12px; 
            display: none;
            border-left: 4px solid;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-error { 
            background: #fef2f2; 
            color: #c41e3a;
            border-left-color: #f5576c;
        }
        
        .alert-success { 
            background: #f0fdf4; 
            color: #16a34a;
            border-left-color: #22c55e;
        }
        
        .code-box { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 28px; 
            border-radius: 14px; 
            font-family: 'Courier New', monospace; 
            font-size: 28px; 
            font-weight: 900;
            text-align: center; 
            margin: 20px 0;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.2);
        }
        
        .code-box:hover { 
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }
        
        .user-card { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 1px solid #e2e8f0;
            border-radius: 14px; 
            padding: 18px; 
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }
        
        .user-card h3 { 
            color: #2d3748; 
            font-size: 15px; 
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .user-card p { 
            color: #718096; 
            font-size: 13px; 
            margin-bottom: 3px;
        }
        
        .badge { 
            display: inline-block; 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: 8px;
        }
        
        .section { 
            display: none; 
        }
        
        .section.active { 
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .profile-box { 
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea;
            border-radius: 14px; 
            padding: 18px; 
            margin-bottom: 18px;
        }
        
        .profile-box h3 { 
            color: #667eea; 
            font-size: 15px; 
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .profile-box p { 
            color: #2d3748; 
            font-size: 14px; 
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .users-count { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 24px; 
            border-radius: 14px; 
            text-align: center; 
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        
        .users-count h2 { 
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .users-count p { 
            color: rgba(255, 255, 255, 0.9); 
            font-size: 13px;
            font-weight: 500;
        }
        
        .password-container { 
            position: relative; 
        }
        
        .password-toggle { 
            position: absolute; 
            right: 14px; 
            top: 50%; 
            transform: translateY(-50%); 
            cursor: pointer; 
            font-size: 18px;
            transition: all 0.2s ease;
        }
        
        .password-toggle:hover {
            transform: translateY(-50%) scale(1.2);
        }
        
        .strength-bar { 
            height: 5px; 
            background: #e2e8f0; 
            border-radius: 3px; 
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-fill { 
            height: 100%; 
            border-radius: 3px; 
            transition: all 0.3s ease; 
            width: 0%;
        }
        
        .loading { 
            opacity: 0.7; 
            pointer-events: none; 
        }
        
        .spinner { 
            display: inline-block; 
            width: 15px; 
            height: 15px; 
            border: 2.5px solid white; 
            border-top-color: transparent; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            margin-right: 8px; 
            vertical-align: middle; 
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        
        .verify-box { 
            background: linear-gradient(135deg, #fa709a15 0%, #fee14015 100%);
            border: 2px solid #fa709a;
            border-radius: 14px; 
            padding: 18px; 
            text-align: center; 
            margin: 12px 0; 
        }
        
        .verify-box p { 
            color: #92400e; 
            font-size: 14px; 
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .search-box { 
            width: 100%; 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            margin-bottom: 18px; 
            font-size: 14px; 
            outline: none;
            background: #f9fafb;
            transition: all 0.3s ease;
        }
        
        .search-box:focus { 
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .invite-input { 
            letter-spacing: 10px; 
            font-size: 22px; 
            font-weight: 900; 
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h2>🎮 GAMEVERSE</h2>
        <p>СИСТЕМА АКТИВАЦИИ ИГРОКОВ</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('register', this)">📝 Регистрация</button>
        <button class="tab" onclick="switchTab('login', this)">🔑 Вход</button>
        <button class="tab" onclick="switchTab('users', this)">👥 Игроки</button>
    </div>

    <!-- РЕГИСТРАЦИЯ -->
    <div class="section active" id="register">
        <form id="regForm">
            <div class="form-group">
                <label>КОД ПРИГЛАШЕНИЯ (4 цифры) *</label>
                <input type="text" id="inviteCode" class="invite-input" placeholder="0000" maxlength="4" required>
            </div>
            <div class="form-group">
                <label>ИГРОВОЙ НИКНЕЙМ *</label>
                <input type="text" id="robloxNick" placeholder="Ваш никнейм в игре" required>
            </div>
            <div class="form-group">
                <label>EMAIL *</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>ИМЯ *</label>
                <div class="input-row">
                    <select id="firstName" required></select>
                    <button type="button" class="rand-btn" onclick="randSelect('firstName')">🎲</button>
                </div>
            </div>
            <div class="form-group">
                <label>ФАМИЛИЯ *</label>
                <div class="input-row">
                    <input type="text" id="surname" placeholder="С большой буквы" required>
                    <button type="button" class="rand-btn" onclick="randInput('surname', surnamesList)">🎲</button>
                </div>
            </div>
            <div class="form-group">
                <label>ОТЧЕСТВО *</label>
                <div class="input-row">
                    <input type="text" id="patronymic" placeholder="С большой буквы" required>
                    <button type="button" class="rand-btn" onclick="randInput('patronymic', patronymicsList)">🎲</button>
                </div>
            </div>
            <div class="form-group">
                <label>ПАРОЛЬ (8-16 СИМВОЛОВ) *</label>
                <div class="password-container">
                    <input type="password" id="regPass" minlength="8" maxlength="16" placeholder="Минимум 8 символов" required>
                    <span class="password-toggle" onclick="togglePass('regPass')">👁️</span>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <p id="strengthText" style="font-size:12px; margin-top:6px; color:#718096; font-weight:500;"></p>
            </div>
            <div class="form-group">
                <label>ВОЗРАСТ</label>
                <input type="text" value="10 лет" disabled style="background:#f0fdf4; text-align:center; font-weight:600; color:#16a34a;">
            </div>
            <div id="regAlert" class="alert alert-error"></div>
            <button type="submit" class="btn btn-primary" id="regBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </form>

        <!-- Подтверждение почты -->
        <div id="verifySection" style="display:none;">
            <div class="verify-box">
                <p style="font-size:16px; font-weight:700; margin-bottom:15px;">📧 Письмо отправлено!</p>
                <p>Подтвердите email и нажмите кнопку ниже.</p>
                <button class="btn btn-warning" id="checkVerifyBtn" onclick="checkVerification()" style="margin-top:15px;">
                    ✅ Я подтвердил почту
                </button>
                <button class="btn btn-secondary" style="margin-top:10px;" onclick="resendEmail()">
                    🔄 Отправить снова
                </button>
            </div>
            <div id="verifyAlert" class="alert alert-error"></div>
        </div>

        <!-- Успех -->
        <div id="regSuccess" style="display:none; text-align:center;">
            <p style="color:#16a34a; font-weight:700; font-size:18px; margin-bottom:8px;">🎉 Регистрация успешна!</p>
            <p style="font-size:14px; color:#718096; margin-bottom:15px; font-weight:500;">Ваш код активации:</p>
            <div class="code-box" id="regCode" onclick="copyCode('regCode')" title="Нажмите чтобы скопировать"></div>
            <p style="font-size:12px; color:#a0aec0; margin-bottom:18px;">👆 Нажмите на код чтобы скопировать</p>
            <button class="btn btn-secondary" onclick="resetReg()">← НАЗАД</button>
        </div>
    </div>

    <!-- ВХОД -->
    <div class="section" id="login">
        <form id="loginForm">
            <div class="form-group">
                <label>EMAIL *</label>
                <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>ПАРОЛЬ *</label>
                <div class="password-container">
                    <input type="password" id="loginPass" placeholder="Ваш пароль" required>
                    <span class="password-toggle" onclick="togglePass('loginPass')">👁️</span>
                </div>
            </div>
            <div id="loginAlert" class="alert alert-error"></div>
            <button type="submit" class="btn btn-primary" id="loginBtn">ВОЙТИ</button>
            <button type="button" class="btn btn-secondary" onclick="forgotPassword()" style="margin-top:10px;">🔑 Забыл пароль</button>
        </form>

        <!-- После входа -->
        <div id="loginSuccess" style="display:none;">
            <div class="profile-box">
                <h3>👤 Ваш профиль</h3>
                <p id="profileNick"></p>
                <p id="profileFullName"></p>
                <p id="profileEmail"></p>
                <p id="profileDate"></p>
            </div>
            <p style="font-size:13px; color:#2d3748; margin-bottom:8px; font-weight:600;">🔑 Код активации:</p>
            <div class="code-box" id="loginCode" onclick="copyCode('loginCode')" title="Нажмите чтобы скопировать"></div>
            <p style="font-size:12px; color:#a0aec0; margin-bottom:12px; text-align:center;">👆 Нажмите на код чтобы скопировать</p>
            <button class="btn btn-warning" onclick="quickSwitch()" style="margin-top:12px;">🔄 Другой аккаунт</button>
            <button class="btn btn-danger" onclick="logout()">🚪 Выйти</button>
        </div>
    </div>

    <!-- ИГРОКИ -->
    <div class="section" id="users">
        <div class="users-count">
            <h2 id="usersCount">—</h2>
            <p>Всего зарегистрировано игроков</p>
        </div>
        <input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск по нику или имени..." oninput="filterUsers()">
        <div id="usersList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, signOut, sendPasswordResetEmail, reload } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCp4fjKxY3PO-wyW-hPcb2Smzy36j0W6X8",
    authDomain: "roblox-registration.firebaseapp.com",
    projectId: "roblox-registration",
    storageBucket: "roblox-registration.firebasestorage.app",
    messagingSenderId: "1073755164080",
    appId: "1:1073755164080:web:ebd817f94dbd1166491a75",
    measurementId: "G-LFW87CNQ09"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window._auth = auth;
window._db = db;

function getCode(nick) {
    let sum = 0;
    nick = nick.toLowerCase().trim();
    for (let i = 0; i < nick.length; i++) sum += nick.charCodeAt(i) * (i + 1);
    const s = String((sum * 777) + 12345).padEnd(8, '0');
    return `GV-${s.slice(0,4)}-${s.slice(4,8)}`;
}
window.getCode = getCode;

window.allUsers = [];

// РЕГИСТРАЦИЯ
document.getElementById('regForm').onsubmit = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const alertBox = document.getElementById('regAlert');

    const inviteCode = document.getElementById('inviteCode').value.trim();
    const nick = document.getElementById('robloxNick').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const name = document.getElementById('firstName').value;
    const surname = document.getElementById('surname').value.trim();
    const patronymic = document.getElementById('patronymic').value.trim();
    const pass = document.getElementById('regPass').value;

    btn.innerHTML = '<span class="spinner"></span>ПРОВЕРКА...';
    btn.classList.add('loading');
    alertBox.style.display = 'none';

    try {
        // ✅ ПРОВЕРКА АДМИНА
        const adminSnap = await getDocs(query(
            collection(db, 'admins'),
            where('email', '==', email)
        ));

        if (!adminSnap.empty) {
            throw new Error('❌ Этот email зарезервирован для администратора! Используйте другой email.');
        }

        // Проверяем код приглашения
        const inviteSnap = await getDocs(query(
            collection(db, 'invites'),
            where('code', '==', inviteCode),
            where('email', '==', email),
            where('used', '==', false)
        ));

        if (inviteSnap.empty) {
            throw new Error('❌ Неверный код приглашения или email не совпадает!');
        }

        const inviteDoc = inviteSnap.docs[0];

        const nickSnap = await getDocs(query(
            collection(db, 'users'),
            where('nick', '==', nick)
        ));
        if (!nickSnap.empty) {
            throw new Error('❌ Этот никнейм уже зарегистрирован!');
        }

        const nameSnap = await getDocs(query(
            collection(db, 'users'),
            where('name', '==', name),
            where('surname', '==', surname),
            where('patronymic', '==', patronymic)
        ));
        if (!nameSnap.empty) {
            throw new Error('❌ Такое ФИО уже существует! Измените отчество.');
        }

        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(userCred.user);

        window._pendingUser = {
            uid: userCred.user.uid,
            nick, email, name, surname, patronymic,
            code: getCode(nick),
            registeredAt: new Date().toLocaleDateString('ru-RU'),
            inviteDocId: inviteDoc.id
        };

        document.getElementById('regForm').style.display = 'none';
        document.getElementById('verifySection').style.display = 'block';

    } catch (error) {
        let msg = error.message || 'Неизвестная ошибка';
        if (msg.includes('email-already-in-use')) msg = '❌ Этот email уже используется!';
        if (msg.includes('weak-password')) msg = '❌ Пароль слишком простой!';
        if (msg.includes('invalid-email')) msg = '❌ Неверный формат email!';
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
    }

    btn.innerHTML = 'ЗАРЕГИСТРИРОВАТЬСЯ';
    btn.classList.remove('loading');
};

// ПРОВЕРКА ПОЧТЫ
window.checkVerification = async function() {
    const btn = document.getElementById('checkVerifyBtn');
    const alertBox = document.getElementById('verifyAlert');

    btn.innerHTML = '<span class="spinner"></span>ПРОВЕРКА...';
    btn.classList.add('loading');
    alertBox.style.display = 'none';

    const timeout = setTimeout(() => {
        btn.innerHTML = '✅ Я подтвердил почту';
        btn.classList.remove('loading');
        alertBox.textContent = '⚠️ Превышено время! Попробуйте снова.';
        alertBox.style.display = 'block';
    }, 10000);

    try {
        await reload(auth.currentUser);

        if (auth.currentUser.emailVerified) {
            clearTimeout(timeout);
            const data = window._pendingUser;

            await setDoc(doc(db, 'users', data.uid), {
                nick: data.nick,
                email: data.email,
                name: data.name,
                surname: data.surname,
                patronymic: data.patronymic,
                code: data.code,
                registeredAt: data.registeredAt,
                uid: data.uid
            });

            await updateDoc(doc(db, 'invites', data.inviteDocId), {
                used: true,
                usedBy: data.nick,
                usedAt: new Date().toLocaleDateString('ru-RU')
            });

            document.getElementById('verifySection').style.display = 'none';
            document.getElementById('regSuccess').style.display = 'block';
            document.getElementById('regCode').textContent = data.code;

        } else {
            clearTimeout(timeout);
            alertBox.textContent = '⚠️ Почта не подтверждена! Проверьте письмо и папку Спам.';
            alertBox.style.display = 'block';
        }
    } catch (error) {
        clearTimeout(timeout);
        let msg = '❌ Ошибка: ' + error.message;
        if (error.code === 'permission-denied') msg = '❌ Нет доступа! Проверь правила Firestore.';
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
    }

    btn.innerHTML = '✅ Я подтвердил почту';
    btn.classList.remove('loading');
};

window.resendEmail = async function() {
    try {
        await sendEmailVerification(auth.currentUser);
        alert('📧 Письмо отправлено повторно!');
    } catch (error) {
        alert('❌ Ошибка: ' + error.message);
    }
};

// ВХОД
document.getElementById('loginForm').onsubmit = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('loginAlert');
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;

    btn.innerHTML = '<span class="spinner"></span>ВХОД...';
    btn.classList.add('loading');
    alertBox.style.display = 'none';

    try {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);

        if (!userCred.user.emailVerified) {
            await signOut(auth);
            throw new Error('⚠️ Сначала подтвердите почту!');
        }

        const userData = await getDoc(doc(db, 'users', userCred.user.uid));

        if (userData.exists()) {
            const d = userData.data();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('loginSuccess').style.display = 'block';
            document.getElementById('profileNick').textContent = '🎮 Ник: ' + d.nick;
            document.getElementById('profileFullName').textContent = '👤 ' + d.surname + ' ' + d.name + ' ' + d.patronymic;
            document.getElementById('profileEmail').textContent = '📧 ' + d.email;
            document.getElementById('profileDate').textContent = '📅 ' + d.registeredAt;
            document.getElementById('loginCode').textContent = d.code;
            localStorage.setItem('lastEmail', email);
        }
    } catch (error) {
        let msg = error.message;
        if (msg.includes('invalid-credential') || msg.includes('wrong-password') || msg.includes('user-not-found')) {
            msg = '❌ Неверный email или пароль!';
        }
        if (msg.includes('too-many-requests')) msg = '❌ Слишком много попыток! Подождите.';
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
    }

    btn.innerHTML = 'ВОЙТИ';
    btn.classList.remove('loading');
};

window.logout = async function() {
    await signOut(auth);
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loginSuccess').style.display = 'none';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginAlert').style.display = 'none';
};

window.quickSwitch = async function() {
    await signOut(auth);
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loginSuccess').style.display = 'none';
    document.getElementById('loginEmail').value = localStorage.getItem('lastEmail') || '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginAlert').style.display = 'none';
    document.getElementById('loginPass').focus();
};

window.forgotPassword = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) { alert('Введите email выше!'); return; }
    try {
        await sendPasswordResetEmail(auth, email);
        alert('📧 Письмо для сброса пароля отправлено!');
    } catch (error) {
        alert('❌ ' + error.message);
    }
};

window.loadUsers = async function() {
    const list = document.getElementById('usersList');
    const count = document.getElementById('usersCount');
    list.innerHTML = '<p style="text-align:center; color:#a0aec0; padding:20px;">Загрузка...</p>';
    try {
        const snap = await getDocs(collection(db, 'users'));
        count.textContent = snap.size;
        window.allUsers = [];
        snap.forEach(d => window.allUsers.push(d.data()));
        renderUsers(window.allUsers);
    } catch (error) {
        list.innerHTML = '<p style="text-align:center; color:#f5576c;">❌ Ошибка загрузки</p>';
    }
};

window.renderUsers = function(users) {
    const list = document.getElementById('usersList');
    if (users.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#a0aec0; padding:20px;">Игроков нет</p>';
        return;
    }
    list.innerHTML = users.map(d => `
        <div class="user-card">
            <h3>🎮 ${d.nick} <span class="badge">✅ Активен</span></h3>
            <p>👤 ${d.surname} ${d.name} ${d.patronymic}</p>
            <p>📧 ${d.email}</p>
            <p>📅 ${d.registeredAt}</p>
        </div>
    `).join('');
};

window.filterUsers = function() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const filtered = window.allUsers.filter(u =>
        u.nick.toLowerCase().includes(q) ||
        u.name.toLowerCase().includes(q) ||
        u.surname.toLowerCase().includes(q)
    );
    renderUsers(filtered);
};

window.copyCode = function(id) {
    const code = document.getElementById(id).textContent;
    navigator.clipboard.writeText(code).then(() => {
        const el = document.getElementById(id);
        const old = el.textContent;
        el.textContent = '✅ СКОПИРОВАНО!';
        setTimeout(() => el.textContent = old, 1500);
    });
};
</script>

        if (this.value.length > 0) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
    });

document.getElementById('regPass').addEventListener('input', function() {
    const p = this.value;
    let strength = 0;
    if (p.length >= 8) strength++;
    if (p.length >= 12) strength++;
    if (/[A-Z]/.test(p)) strength++;
    if (/[0-9]/.test(p)) strength++;
    const colors = ['#f5576c','#fa709a','#fee140','#22c55e'];
    const texts = ['Слабый 😟','Средний 😐','Хороший 🙂','Отличный 💪'];
    const fill = document.getElementById('strengthFill');
    fill.style.width = (strength * 25) + '%';
    fill.style.background = colors[strength-1] || '#e2e8f0';
    document.getElementById('strengthText').textContent = texts[strength-1] || '';
});

function resetReg() {
