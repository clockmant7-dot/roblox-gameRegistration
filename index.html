<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Activation System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .logo { text-align: center; background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .logo h2 { color: #38bdf8; font-size: 22px; }
        .logo p { color: #94a3b8; font-size: 11px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #f1f5f9; padding: 5px; border-radius: 10px; }
        .tab { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; background: transparent; color: #64748b; transition: 0.2s; }
        .tab.active { background: white; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 12px; color: #475569; margin-bottom: 5px; }
        .input-row { display: flex; gap: 6px; }
        input, select { width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #38bdf8; }
        .rand-btn { background: #38bdf8; color: white; border: none; border-radius: 8px; width: 42px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .btn-primary { background: #38bdf8; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-danger { background: #ef4444; color: white; margin-top: 10px; }
        .btn-secondary { background: #64748b; color: white; margin-top: 5px; }
        .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .code-box { background: #0f172a; color: #38bdf8; padding: 20px; border-radius: 12px; font-family: monospace; font-size: 26px; font-weight: bold; text-align: center; margin: 15px 0; border: 2px dashed #38bdf8; }
        .user-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .user-card h3 { color: #0f172a; font-size: 14px; margin-bottom: 5px; }
        .user-card p { color: #64748b; font-size: 12px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; background: #dbeafe; color: #1d4ed8; margin-left: 5px; }
        .section { display: none; }
        .section.active { display: block; }
        .profile-box { background: #f0f9ff; border: 2px solid #38bdf8; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .profile-box h3 { color: #0369a1; font-size: 14px; margin-bottom: 8px; }
        .profile-box p { color: #475569; font-size: 13px; margin-bottom: 3px; }
        .users-count { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .users-count h2 { font-size: 36px; }
        .users-count p { color: #94a3b8; font-size: 13px; }
        .password-container { position: relative; }
        .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; }
        .strength-bar { height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 6px; }
        .strength-fill { height: 100%; border-radius: 2px; transition: 0.3s; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { color: #94a3b8; font-size: 12px; }
        .loading { opacity: 0.6; pointer-events: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">

    <!-- НАВИГАЦИЯ -->
    <div class="logo">
        <h2>⚙️ ROBLOX STUDIO</h2>
        <p>СИСТЕМА АКТИВАЦИИ И АККАУНТОВ</p>
    </div>

    <div class="tabs" id="mainTabs">
        <button class="tab active" onclick="switchTab('register')">📝 Регистрация</button>
        <button class="tab" onclick="switchTab('login')">🔑 Вход</button>
        <button class="tab" onclick="switchTab('users')">👥 Игроки</button>
    </div>

    <!-- ВКЛАДКА РЕГИСТРАЦИИ -->
    <div class="section active" id="register">
        <form id="regForm">
            <div class="form-group">
                <label>НИКНЕЙМ В ROBLOX *</label>
                <input type="text" id="robloxNick" placeholder="Точно как в игре" required>
            </div>
            <div class="form-group">
                <label>EMAIL (КОД ПРИДЁТ СЮДА) *</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>ИМЯ ПЕРСОНАЖА *</label>
                <div class="input-row">
                    <select id="firstName" required></select>
                    <button type="button" class="rand-btn" onclick="randSelect('firstName', namesList)">🎲</button>
                </div>
            </div>
            <div class="form-group">
                <label>ФАМИЛИЯ *</label>
                <div class="input-row">
                    <input type="text" id="surname" placeholder="С большой буквы" required>
                    <button type="button" class="rand-btn" onclick="randInput('surname', surnamesList)">🎲</button>
                </div>
            </div>
            <div class="form-group">
                <label>ОТЧЕСТВО *</label>
                <div class="input-row">
                    <input type="text" id="patronymic" placeholder="С большой буквы" required>
                    <button type="button" class="rand-btn" onclick="randInput('patronymic', patronymicsList)">🎲</button>
                </div>
            </div>
            <div class="form-group">
                <label>ПАРОЛЬ (8-16 СИМВОЛОВ) *</label>
                <div class="password-container">
                    <input type="password" id="regPass" minlength="8" maxlength="16" placeholder="Минимум 8 символов" required>
                    <span class="password-toggle" onclick="togglePass('regPass')">👁️</span>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <p id="strengthText" style="font-size:11px; margin-top:3px; color:#64748b;"></p>
            </div>
            <div id="regAlert" class="alert alert-error"></div>
            <button type="submit" class="btn btn-primary" id="regBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </form>

        <!-- После регистрации -->
        <div id="regSuccess" style="display:none; text-align:center;">
            <p style="color:#16a34a; font-weight:bold; margin-bottom:5px;">✅ Регистрация успешна!</p>
            <p style="font-size:13px; color:#64748b;">Код активации отправлен на вашу почту</p>
            <div class="code-box" id="regCode"></div>
            <p style="font-size:12px; color:#94a3b8;">Также проверьте почту — туда тоже отправлен код</p>
            <button class="btn btn-secondary" onclick="resetReg()">← НАЗАД</button>
        </div>
    </div>

    <!-- ВКЛАДКА ВХОДА -->
    <div class="section" id="login">
        <form id="loginForm">
            <div class="form-group">
                <label>EMAIL *</label>
                <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>ПАРОЛЬ *</label>
                <div class="password-container">
                    <input type="password" id="loginPass" placeholder="Ваш пароль" required>
                    <span class="password-toggle" onclick="togglePass('loginPass')">👁️</span>
                </div>
            </div>
            <div id="loginAlert" class="alert alert-error"></div>
            <button type="submit" class="btn btn-primary" id="loginBtn">ВОЙТИ</button>
        </form>

        <!-- После входа -->
        <div id="loginSuccess" style="display:none;">
            <div class="profile-box">
                <h3>👤 Ваш профиль</h3>
                <p id="profileNick"></p>
                <p id="profileName"></p>
                <p id="profileEmail"></p>
            </div>
            <p style="font-size:13px; color:#475569; margin-bottom:10px;">Ваш код активации:</p>
            <div class="code-box" id="loginCode"></div>
            <button class="btn btn-secondary" onclick="quickSwitch()">🔄 Быстрая смена аккаунта</button>
            <button class="btn btn-danger" onclick="logout()">🚪 Выйти из аккаунта</button>
        </div>
    </div>

    <!-- ВКЛАДКА ИГРОКОВ -->
    <div class="section" id="users">
        <div class="users-count">
            <h2 id="usersCount">0</h2>
            <p>Всего зарегистрировано игроков</p>
        </div>
        <div id="usersList"></div>
    </div>

</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// !! ЗАМЕНИ ЭТО НА СВОЙ КОД ИЗ FIREBASE !!
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCp4fjKxY3PO-wyW-hPcb2Smzy36j0W6X8",
  authDomain: "roblox-registration.firebaseapp.com",
  projectId: "roblox-registration",
  storageBucket: "roblox-registration.firebasestorage.app",
  messagingSenderId: "1073755164080",
  appId: "1:1073755164080:web:ebd817f94dbd1166491a75",
  measurementId: "G-LFW87CNQ09"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Списки данных
window.namesList = ['Александр','Максим','Иван','Артем','Дмитрий','Никита','Михаил','Даниил','Егор','Андрей','Илья','Алексей','Роман','Сергей','Владислав','Ярослав','Тимофей','Евгений','Денис','Матвей','Павел','Антон','Кирилл','Виктор','Григорий','Анна','Мария','Елена','Дарья','Алина','Ирина','Екатерина','Анастасия','Наталья','Виктория','Ксения','Татьяна','Александра','Полина','София','Ольга','Валерия','Юлия','Маргарита','Алиса','Ева','Милана','Алена','Кристина','Диана','Богдан','Глеб','Дамир','Марк','Мирон','Макар','Руслан','Степан','Федор','Василиса','Вероника','Злата','Кира','Лилия','Мирослава','Яна','Лев','Ян'];
window.surnamesList = ['Иванов','Иванова','Смирнов','Смирнова','Кузнецов','Кузнецова','Попов','Попова','Васильев','Васильева','Петров','Петрова','Соколов','Соколова','Михайлов','Михайлова','Новиков','Новикова','Федоров','Федорова','Морозов','Морозова','Волков','Волкова','Алексеев','Алексеева','Лебедев','Лебедева','Семенов','Семенова','Павлов','Павлова','Козлов','Козлова','Степанов','Степанова','Орлов','Орлова','Макаров','Макарова'];
window.patronymicsList = ['Александрович','Александровна','Иванович','Ивановна','Максимович','Максимовна','Сергеевич','Сергеевна','Дмитриевич','Дмитриевна','Андреевич','Андреевна','Алексеевич','Алексеевна','Михайлович','Михайловна','Евгеньевич','Евгеньевна','Владимирович','Владимировна','Николаевич','Николаевна','Романович','Романовна','Егорович','Егоровна','Денисович','Денисовна','Артемович','Артемовна','Викторович','Викторовна','Игоревич','Игоревна','Павлович','Павловна'];

// Заполнение списка имён
const sel = document.getElementById('firstName');
window.namesList.forEach(n => {
    let o = document.createElement('option');
    o.value = n; o.textContent = n; sel.appendChild(o);
});

// Генерация кода
function getCode(nick) {
    let sum = 0;
    nick = nick.toLowerCase().trim();
    for (let i = 0; i < nick.length; i++) sum += nick.charCodeAt(i) * (i + 1);
    const s = String((sum * 777) + 12345).padEnd(8, '0');
    return `RBX-${s.slice(0,4)}-${s.slice(4,8)}`;
}

// РЕГИСТРАЦИЯ
document.getElementById('regForm').onsubmit = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const alert = document.getElementById('regAlert');
    const nick = document.getElementById('robloxNick').value.trim();
    const email = document.getElementById('email').value.trim();
    const name = document.getElementById('firstName').value;
    const surname = document.getElementById('surname').value.trim();
    const patronymic = document.getElementById('patronymic').value.trim();
    const pass = document.getElementById('regPass').value;

    // Показываем загрузку
    btn.innerHTML = '<span class="spinner"></span>ПРОВЕРКА...';
    btn.classList.add('loading');
    alert.style.display = 'none';

    try {
        // Проверяем уникальность ника
        const nickQuery = await getDocs(query(collection(db, 'users'), where('nick', '==', nick)));
        if (!nickQuery.empty) {
            throw { message: 'Этот никнейм уже зарегистрирован! Каждый ник может быть только один.' };
        }

        // Проверяем уникальность ФИО (хватит совпадения любых двух из трёх)
        const nameQuery = await getDocs(query(collection(db, 'users'),
            where('name', '==', name),
            where('surname', '==', surname),
            where('patronymic', '==', patronymic)
        ));
        if (!nameQuery.empty) {
            throw { message: 'Игрок с таким именем, фамилией и отчеством уже существует! Измените хотя бы отчество.' };
        }

        // Создаём аккаунт в Firebase Auth
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);

        // Отправляем письмо с подтверждением
        await sendEmailVerification(userCred.user);

        // Сохраняем данные в Firestore
        await setDoc(doc(db, 'users', userCred.user.uid), {
            nick: nick,
            email: email,
            name: name,
            surname: surname,
            patronymic: patronymic,
            code: getCode(nick),
            registeredAt: new Date().toLocaleDateString('ru-RU'),
            uid: userCred.user.uid
        });

        // Показываем код
        document.getElementById('regForm').style.display = 'none';
        document.getElementById('regSuccess').style.display = 'block';
        document.getElementById('regCode').textContent = getCode(nick);

    } catch (error) {
        let msg = error.message || 'Неизвестная ошибка';
        if (msg.includes('email-already-in-use')) msg = '❌ Этот email уже используется!';
        if (msg.includes('weak-password')) msg = '❌ Пароль слишком простой!';
        if (msg.includes('invalid-email')) msg = '❌ Неверный формат email!';
        alert.textContent = msg;
        alert.style.display = 'block';
    }

    btn.innerHTML = 'ЗАРЕГИСТРИРОВАТЬСЯ';
    btn.classList.remove('loading');
};

// ВХОД
document.getElementById('loginForm').onsubmit = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const alert = document.getElementById('loginAlert');
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;

    btn.innerHTML = '<span class="spinner"></span>ВХОД...';
    btn.classList.add('loading');
    alert.style.display = 'none';

    try {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        const userData = await getDoc(doc(db, 'users', userCred.user.uid));

        if (userData.exists()) {
            const d = userData.data();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('loginSuccess').style.display = 'block';
            document.getElementById('profileNick').textContent = '🎮 Ник: ' + d.nick;
            document.getElementById('profileName').textContent = '👤 ' + d.surname + ' ' + d.name + ' ' + d.patronymic;
            document.getElementById('profileEmail').textContent = '📧 ' + d.email;
            document.getElementById('loginCode').textContent = d.code;

            // Сохраняем текущий аккаунт
            localStorage.setItem('lastEmail', email);
        }
    } catch (error) {
        let msg = '❌ Неверный email или пароль!';
        if (error.code === 'auth/user-not-found') msg = '❌ Аккаунт не найден!';
        if (error.code === 'auth/wrong-password') msg = '❌ Неверный пароль!';
        if (error.code === 'auth/too-many-requests') msg = '❌ Слишком много попыток! Подождите.';
        alert.textContent = msg;
        alert.style.display = 'block';
    }

    btn.innerHTML = 'ВОЙТИ';
    btn.classList.remove('loading');
};

// ВЫХОД
window.logout = async function() {
    await signOut(auth);
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loginSuccess').style.display = 'none';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPass').value = '';
};

// БЫСТРАЯ СМЕНА АККАУНТА
window.quickSwitch = async function() {
    await signOut(auth);
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loginSuccess').style.display = 'none';
    // Оставляем email для удобства
    document.getElementById('loginEmail').value = localStorage.getItem('lastEmail') || '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
};

// ЗАГРУЗКА ИГРОКОВ
window.loadUsers = async function() {
    const list = document.getElementById('usersList');
    const count = document.getElementById('usersCount');
    list.innerHTML = '<p style="text-align:center; color:#94a3b8;">Загрузка...</p>';

    const snap = await getDocs(collection(db, 'users'));
    count.textContent = snap.size;
    list.innerHTML = '';

    snap.forEach(doc => {
        const d = doc.data();
        list.innerHTML += `
            <div class="user-card">
                <h3>🎮 ${d.nick} <span class="badge">Активирован</span></h3>
                <p>👤 ${d.surname} ${d.name} ${d.patronymic}</p>
                <p>📅 Дата регистрации: ${d.registeredAt}</p>
            </div>
        `;
    });

    if (snap.size === 0) {
        list.innerHTML = '<p style="text-align:center; color:#94a3b8;">Пока нет игроков</p>';
    }
};

</script>

<script>
// Переключение вкладок
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
    if (tab === 'users') window.loadUsers();
}

// Показать/скрыть пароль
function togglePass(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
}

// Сила пароля
document.getElementById('regPass').addEventListener('input', function() {
    const p = this.value;
    let strength = 0;
    if (p.length >= 8) strength++;
    if (p.length >= 12) strength++;
    if (/[A-Z]/.test(p)) strength++;
    if (/[0-9]/.test(p)) strength++;
    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
    const texts = ['Слабый', 'Средний', 'Хороший', 'Отличный'];
    const fill = document.getElementById('strengthFill');
    fill.style.width = (strength * 25) + '%';
    fill.style.background = colors[strength - 1] || '#e2e8f0';
    document.getElementById('strengthText').textContent = texts[strength - 1] || '';
});

// Авто заглавная буква
function autoCapitalize(id) {
    document.getElementById(id).addEventListener('input', function() {
        if (this.value.length > 0) this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
    });
}
autoCapitalize('surname');
autoCapitalize('patronymic');

// Рандомные поля
function randInput(id, list) { document.getElementById(id).value = list[Math.floor(Math.random() * list.length)]; }
function randSelect(id, list) {
    const sel = document.getElementById(id);
    sel.selectedIndex = Math.floor(Math.random() * sel.options.length);
}

// Сброс формы
function resetReg() {
    document.getElementById('regForm').style.display = 'block';
    document.getElementById('regSuccess').style.display = 'none';
}
</script>
</body>
</html>
